<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SureShot King 👑 | Parvinder Singh</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    background:#050505;
    color:#fff;
    font-family:Arial,sans-serif;
    padding:15px 10px;
}

.container{
    width:100%;
    max-width:430px;
    margin:auto;
    text-align:center;
}


/* =========================
   PHOTOS
========================= */

.photo-link{
    display:block;
    width:max-content;
    margin:0 auto;
}

.profile-photo{
    width:105px;
    height:105px;
    object-fit:cover;
    border-radius:50%;
    border:3px solid #ff2020;
    box-shadow:0 0 22px rgba(255,0,0,.35);
    display:block;
}

.top-photo{
    margin-bottom:9px;
}

.bottom-photo{
    margin:10px auto 7px;
}


/* =========================
   HEADER
========================= */

.crown{
    font-size:32px;
    line-height:1;
    margin-bottom:2px;
}

.king{
    color:#ff2020;
    font-size:27px;
    font-weight:800;
    line-height:1.15;
}

.name{
    color:#fff;
    font-size:19px;
    font-weight:bold;
    margin-top:5px;
    margin-bottom:13px;
}


/* =========================
   TELEGRAM BUTTON
========================= */

.telegram-btn{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;

    background:#e50914;
    color:#fff;
    text-decoration:none;

    padding:13px 10px;
    border-radius:12px;

    margin:11px 0;

    font-size:15px;
    font-weight:bold;

    box-shadow:0 6px 18px rgba(229,9,20,.30);
}

.button-text{
    flex:1;
    text-align:center;
}

.telegram-icon{
    width:21px;
    height:21px;

    flex-shrink:0;

    background:#fff;
    color:#e50914;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:12px;

    animation:telegramDance 1.2s ease-in-out infinite;
}

@keyframes telegramDance{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-4px);
    }

}


/* =========================
   WORK INFORMATION
========================= */

.card{
    background:#111;

    border:1px solid #292929;

    border-radius:15px;

    padding:15px 13px;

    margin:11px 0;

    box-shadow:0 7px 22px rgba(0,0,0,.45);
}

.heading{
    color:#ff2929;

    font-size:18px;

    font-weight:bold;

    margin-bottom:7px;
}

.text{
    color:#d0d0d0;

    font-size:14px;

    line-height:1.55;
}


/* =========================
   COUNTDOWN
========================= */

.count-title{
    color:#ff3030;

    font-size:16px;

    font-weight:bold;

    margin-bottom:10px;
}

.timer{
    display:flex;

    justify-content:center;

    gap:6px;
}

.time-box{
    background:#050505;

    border:1px solid #333;

    border-radius:9px;

    padding:8px 5px;

    min-width:63px;
}

.number{
    color:#fff;

    font-size:21px;

    font-weight:bold;
}

.label{
    color:#888;

    font-size:9px;

    margin-top:3px;
}


/* =========================
   REVIEW SECTION
   ALL 4 IN ONE SCREEN
========================= */

.review-section{
    width:100%;
    margin-top:14px;
}

.section-title{
    color:#ff2929;

    font-size:20px;

    font-weight:bold;

    margin:9px 0 7px;
}

.review-grid{

    width:100%;

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:5px;
}

.review-card{

    width:100%;

    height:145px;

    background:#111;

    border:1px solid #292929;

    border-radius:8px;

    padding:2px;

    overflow:hidden;
}

.review-card img{

    width:100%;

    height:100%;

    display:block;

    object-fit:contain;

    background:#000;

    border-radius:6px;
}


/* =========================
   SECOND SECTION
========================= */

.second-screen{

    width:100%;

    margin-top:25px;

    padding-top:15px;

    border-top:1px solid #222;
}

.video-title{

    color:#ff2929;

    font-size:21px;

    font-weight:bold;

    margin-bottom:9px;
}


/* =========================
   6 COMPACT VIDEOS
========================= */

.video-card{

    width:100%;

    background:#111;

    border:1px solid #292929;

    border-radius:11px;

    padding:5px;

    margin:8px 0;
}

.video-card video{

    width:100%;

    height:180px;

    display:block;

    object-fit:contain;

    background:#000;

    border-radius:7px;
}


/* =========================
   @goodarts1185 BUTTON
========================= */

.profile-telegram-btn{

    display:inline-flex;

    align-items:center;

    justify-content:center;

    gap:8px;

    margin-top:12px;

    margin-bottom:2px;

    padding:9px 18px;

    border-radius:10px;

    background:linear-gradient(
        45deg,
        #feda75,
        #fa7e1e,
        #d62976,
        #962fbf,
        #4f5bd5
    );

    color:#fff;

    text-decoration:none;

    font-size:15px;

    font-weight:bold;

    box-shadow:
        0 5px 16px
        rgba(214,41,118,.25);
}

.profile-telegram-btn:active{
    transform:scale(.97);
}


/* INSTAGRAM-STYLE ICON */

.ig-icon{

    width:18px;
    height:18px;

    border:2px solid #fff;

    border-radius:5px;

    position:relative;
}

.ig-icon:before{

    content:"";

    position:absolute;

    width:6px;
    height:6px;

    border:2px solid #fff;

    border-radius:50%;

    left:4px;
    top:4px;
}

.ig-icon:after{

    content:"";

    position:absolute;

    width:3px;
    height:3px;

    background:#fff;

    border-radius:50%;

    right:1px;
    top:1px;
}


/* =========================
   TERMS
========================= */

.terms{

    color:#777;

    font-size:10px;

    line-height:1.5;

    margin-top:15px;
}

.footer{

    color:#555;

    font-size:10px;

    margin-top:9px;
}

</style>
</head>
